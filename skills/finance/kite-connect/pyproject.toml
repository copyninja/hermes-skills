[project]
name = "kite-connect-hermes"
version = "1.0.0"
description = "Kite Connect v3 auth + read-only portfolio tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "tomli>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
keyring = ["secretstorage>=3.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["kite_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]